# ── 第三层：X（via TwitterAPI.io，鉴权用 .env 的 TWITTERAPI_KEY）────
# handle 为【候选】，由 resolve 脚本逐个 /twitter/user/info 核实后回填 user_id；
# 核实前 enabled 暂置 false，确认名单 + 成本后再开。person_type: reporter/scholar/vc_kol。
x:
  enabled: true
  lookback_days: 7
  max_per_account: 10
  include_replies: false        # 只原创
  drop_retweets: true
