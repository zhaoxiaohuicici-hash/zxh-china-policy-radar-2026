# ── 第三层：Bluesky（人的实时观点，免费公开 API，无需鉴权）────────
# accounts 为【已人工核实匹配】的账号；显示名/简介能对上其机构·头衔才纳入。
bluesky:
  enabled: true
  lookback_days: 7
  max_per_account: 8
  drop_reposts: true      # 过滤转发
  drop_replies: false     # 回复常含观点，默认保留
  accounts:
    - { name: Ana Swanson,       handle: anaswanson.bsky.social }   # NYT 贸易
    - { name: Lingling Wei,      handle: lingling-wei.bsky.social } # WSJ 首席中国
    - { name: Scott Kennedy,     handle: kennedychina.bsky.social } # CSIS
    - { name: Jordan Schneider,  handle: jordanschneider.bsky.social } # ChinaTalk
    - { name: Bill Bishop,       handle: billbishop.bsky.social }   # Sinocism
    - { name: Adam Tooze,        handle: adamtooze.bsky.social }    # Chartbook
    - { name: Chad Bown,         handle: chadpbown.com }            # PIIE
    - { name: Martin Chorzempa,  handle: chorzempa.bsky.social }    # PIIE
    - { name: Rush Doshi,        handle: rushdoshi.bsky.social }    # CFR/Georgetown
    - { name: Bonnie Glaser,     handle: bglaser.bsky.social }      # GMF
    - { name: Ilaria Mazzocco,   handle: ilariamazzocco.bsky.social } # CSIS 清洁技术
    - { name: Graham Webster,    handle: gwbstr.com }               # Stanford DigiChina
