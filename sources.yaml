# 中美政策「早期信号雷达」信号源配置（第①②层）
# 来源：监测清单_v2.md 末尾「机器可读：①②层信号源」附录。
# URL 以 validate.py 首跑校验为准；失效的会被列出待修。

# ── 第一层：官方 ───────────────────────────────────────────────
federal_register:                       # 免费 JSON API，无需 key
  endpoint: https://www.federalregister.gov/api/v1/documents.json
  lookback_days: 7
  # 机构过滤（slug 经 /agencies 端点核实）：只保留这几个机构的规则，砍掉
  # 全文搜索带进来的无关法规噪音。conditions[agencies][] 之间是 OR，
  # 与 term 之间是 AND。
  agencies:
    - industry-and-security-bureau                 # BIS 出口管制/实体清单
    - foreign-assets-control-office                # OFAC 制裁
    - trade-representative-office-of-united-states # USTR 301/232
    - treasury-department                          # Treasury（FEOC 等）
    - commerce-department                          # Commerce（反倾销/ITA 等）
  queries:                              # 宽泛词加引号做精确短语匹配
    - '"export controls" China'
    - '"entity list"'
    - '"Section 301" China'
    - '"Section 232" China'
    - '"Chinese military companies"'    # 1260H 相关
    - '"outbound investment" China'
    - '"solar cells" China antidumping'
    - '"lithium-ion battery" FEOC'

congress_api:                           # 免费，需 api.data.gov key (CONGRESS_API_KEY)
  endpoint: https://api.congress.gov/v3
  congress: 119
  watch:
    - "BIOSECURE"
    - "outbound investment"
    - "China"
    - "de minimis"
    - "connected vehicles"

official_rss:
  # 这些机构无可靠官方 RSS（OFAC 的 RSS 已于 2025/1 停用，USTR 等只有新闻页），
  # 改用 Google News RSS 按关键词代理订阅。
  - name: OFAC Recent Actions
    url: https://news.google.com/rss/search?q=OFAC+sanctions+China&hl=en-US&gl=US&ceid=US:en
  - name: USTR Press
    url: https://news.google.com/rss/search?q=USTR+China+tariff+Section+301&hl=en-US&gl=US&ceid=US:en
  - name: House Select Committee on the CCP
    url: https://news.google.com/rss/search?q=%22Select+Committee%22+China+CCP&hl=en-US&gl=US&ceid=US:en
  - name: Senate Finance
    url: https://news.google.com/rss/search?q=Senate+Finance+Committee+China+trade&hl=en-US&gl=US&ceid=US:en
  - name: House Ways & Means
    url: https://news.google.com/rss/search?q=Ways+and+Means+China+trade&hl=en-US&gl=US&ceid=US:en

